name: Build Windows Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Check project
        run: godot --headless --editor --quit

      - name: Build Windows EXE
        run: godot --headless --export-release "Windows Desktop" TinyRPG.exe

      - name: Check EXE
        run: test -s TinyRPG.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TinyRPG-Windows
          path: TinyRPG.exe
