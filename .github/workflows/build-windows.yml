name: Build Windows Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot project
        run: godot --headless --path . --editor --quit

      - name: Export Windows executable
        run: godot --headless --path . --export-release "Windows Desktop" "Ashwood.exe"

      - name: Verify executable
        run: test -s Ashwood.exe

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: Ashwood-Windows
          path: Ashwood.exe
          if-no-files-found: error
