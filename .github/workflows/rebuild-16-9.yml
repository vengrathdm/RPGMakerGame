name: Rebuild RPG Maker XP 16:9 core
on:
  push:
    paths: ["Tools/rebuild_16_9.rb","Tools/rgss/rpgmakergame_16_9_core.rb"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: "3.2"}
      - run: ruby Tools/rebuild_16_9.rb
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Scripts.rxdata
          git diff --cached --quiet || git commit -m "Rebuild game for 16:9 gameplay"
          git push
